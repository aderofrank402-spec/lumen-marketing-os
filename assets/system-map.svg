<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title desc">
  <title id="title">Lumen Marketing OS system architecture</title>
  <desc id="desc">Operator entrypoints flow through nine department workflows, policy gates, durable execution, provider adapters, operational state, and audit controls.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071126"/>
      <stop offset="1" stop-color="#0b2239"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132946"/>
      <stop offset="1" stop-color="#0c1c35"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#67e8f9"/>
    </marker>
    <style>
      .title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px 'Segoe UI', Arial, sans-serif; fill: #9fb4cf; }
      .label { font: 650 17px 'Segoe UI', Arial, sans-serif; fill: #f8fafc; text-anchor: middle; }
      .detail { font: 400 13px 'Segoe UI', Arial, sans-serif; fill: #9fb4cf; text-anchor: middle; }
      .card { fill: url(#card); stroke: #2a5078; stroke-width: 1.5; }
      .accent { fill: #082f49; stroke: #22d3ee; stroke-width: 1.8; }
      .line { fill: none; stroke: #67e8f9; stroke-width: 2; marker-end: url(#arrow); }
      .control { fill: none; stroke: #fbbf24; stroke-width: 1.7; stroke-dasharray: 7 6; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1280" height="520" rx="22" fill="url(#background)"/>
  <text x="54" y="58" class="title">System architecture</text>
  <text x="54" y="84" class="subtitle">Evidence, decisions, durable execution, and external effects remain separate.</text>

  <path class="line" d="M 225 190 H 285"/>
  <path class="line" d="M 485 190 H 545"/>
  <path class="line" d="M 745 190 H 805"/>
  <path class="line" d="M 1005 190 H 1065"/>
  <path class="line" d="M 645 240 V 342"/>
  <path class="line" d="M 905 240 V 342"/>
  <path class="line" d="M 1165 240 V 342 H 1035"/>
  <path class="control" d="M 375 412 V 270 H 385 V 240"/>
  <path class="control" d="M 455 412 H 850 V 270 H 905 V 240"/>

  <rect x="45" y="140" width="180" height="100" rx="14" class="card"/>
  <text x="135" y="179" class="label">Operator</text>
  <text x="135" y="204" class="detail">CLI and schedules</text>

  <rect x="285" y="140" width="200" height="100" rx="14" class="accent"/>
  <text x="385" y="179" class="label">9 departments</text>
  <text x="385" y="204" class="detail">35 bounded roles</text>

  <rect x="545" y="140" width="200" height="100" rx="14" class="card"/>
  <text x="645" y="179" class="label">Policy gates</text>
  <text x="645" y="204" class="detail">Evidence and approval</text>

  <rect x="805" y="140" width="200" height="100" rx="14" class="accent"/>
  <text x="905" y="179" class="label">Durable execution</text>
  <text x="905" y="204" class="detail">Jobs, leases, outbox</text>

  <rect x="1065" y="140" width="170" height="100" rx="14" class="card"/>
  <text x="1150" y="179" class="label">Adapters</text>
  <text x="1150" y="204" class="detail">Explicit effects</text>

  <rect x="545" y="342" width="200" height="92" rx="14" class="card"/>
  <text x="645" y="379" class="label">SQLite state</text>
  <text x="645" y="404" class="detail">18 migrations</text>

  <rect x="805" y="342" width="230" height="92" rx="14" class="card"/>
  <text x="920" y="379" class="label">Audit and recovery</text>
  <text x="920" y="404" class="detail">Traceable outcomes</text>

  <rect x="245" y="370" width="210" height="84" rx="14" fill="#3b2710" stroke="#fbbf24" stroke-width="1.7"/>
  <text x="350" y="405" class="label">Pause controls</text>
  <text x="350" y="430" class="detail">Global and lane level</text>
</svg>
