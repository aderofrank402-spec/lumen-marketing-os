[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen-marketing-os"
version = "0.1.0"
description = "Local operating system foundation for Lumen Sieve marketing"
requires-python = ">=3.11"
dependencies = ["tzdata"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lmos = "lumen_marketing_os.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lumen_marketing_os.db.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
